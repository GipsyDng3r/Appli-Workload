  var f=$("#addf");if(f)f.onsubmit=function(e){e.preventDefault();var v=$("#ns").value.trim();if(!v)return;x.steps.push({l:v,d:false});render();$("#ns")&&$("#ns").focus()};
}

function finish(x){x.steps.forEach(function(s){s.d=true});x.st="Terminé";x.done="2026-10-27";toast("Terminée. Clôture envoyée à "+x.sync.length+" endroits par les flux")}
function classify(x,t,p){x.type=t;x.proj=p;x.steps=TEMPLATES[t].map(function(l){return {l:l,d:false}});toast("Classée « "+t+" » : "+x.steps.length+" étape(s) créée(s) depuis le modèle")}
function render(){
  $("#nav").innerHTML=navHtml();
  var v={dash:dash,tasks:kanban,cal:calendar,stats:stats,trier:trierView,models:models}[view];
  $("#main").innerHTML=v();
  drawer();
}
document.addEventListener("click",function(e){
  var t=e.target, c;
  if(c=t.closest("[data-view]")){view=c.dataset.view;sel=null;render();window.scrollTo(0,0);return}
  if(c=t.closest("[data-sim]")){var s=SIM[simN++%SIM.length],id=Math.max.apply(null,tasks.map(function(y){return y.id}))+1;tasks.push({id:id,t:s.t,type:s.type,src:s.src,proj:"Hors projet",due:"2026-11-03",st:"À faire",link:s.link,sync:s.sync,steps:TEMPLATES[s.type].map(function(l){return {l:l,d:false}})});view="tasks";sel=id;toast("Mail catégorisé « "+s.type+" » : tâche créée avec "+TEMPLATES[s.type].length+" étapes du modèle");render();return}
  if(c=t.closest("[data-refresh]")){toast("Synchronisé avec la liste SharePoint");return}
  if(c=t.closest("[data-finish]")){var x=byId(+c.dataset.finish);if(x){finish(x);sel=x.id;render()}return}
  if(c=t.closest("[data-reopen]")){var r=byId(+c.dataset.reopen);r.st="En cours";delete r.done;if(r.steps.length)r.steps[r.steps.length-1].d=false;toast("Tâche rouverte dans "+r.sync.length+" endroits");render();return}
  if(c=t.closest("[data-class]")){var k=byId(+c.dataset.class),a=c.dataset.from==="dr"?[$("#dt").value,$("#dp").value]:[$("#ct"+k.id).value,$("#cp"+k.id).value];classify(k,a[0],a[1]);if(c.dataset.from!=="dr")sel=null;render();return}
  if(c=t.closest("[data-step]")){var y=byId(sel);if(y&&!isDone(y)){var st=y.steps[+c.dataset.step];st.d=!st.d;if(y.st==="À faire"&&pct(y)>0)y.st="En cours";render()}return}
  if(c=t.closest("[data-set]")){byId(sel).st=c.dataset.set;render();return}
  if(c=t.closest("[data-ft]")){ftype=c.dataset.ft;render();return}
  if(c=t.closest("[data-cal]")){calM+=+c.dataset.cal;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}render();return}
  if(t.closest("[data-close]")){sel=null;drawer();return}
  if(c=t.closest("[data-open],[data-card]")){sel=+(c.dataset.open||c.dataset.card);drawer();return}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&sel){sel=null;drawer()}
  if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.card){e.preventDefault();sel=+e.target.dataset.card;drawer()}
});
var dragId=null;
document.addEventListener("dragstart",function(e){var c=e.target.closest&&e.target.closest("[data-card]");if(c){dragId=+c.dataset.card;c.classList.add("drag");try{e.dataTransfer.setData("text/plain",String(dragId));e.dataTransfer.effectAllowed="move"}catch(x){}}});
document.addEventListener("dragend",function(){dragId=null;document.querySelectorAll(".drag,.over").forEach(function(n){n.classList.remove("drag","over")})});
document.addEventListener("dragover",function(e){var c=e.target.closest&&e.target.closest("[data-col]");if(c&&dragId){e.preventDefault();document.querySelectorAll(".over").forEach(function(n){n.classList.remove("over")});c.classList.add("over")}});
document.addEventListener("drop",function(e){var c=e.target.closest&&e.target.closest("[data-col]");if(c&&dragId){e.preventDefault();var x=byId(dragId),s=c.dataset.col;if(x&&x.st!==s){var was=isDone(x);if(s==="Terminé")finish(x);else{x.st=s;if(was){delete x.done;toast("Tâche rouverte")}}}dragId=null;render()}});
$("#q").oninput=function(){q=this.value;if(view==="dash"||view==="stats"||view==="models"||view==="trier")view="tasks";render();var i=$("#q");i.focus()};
$("#bell").onclick=function(){toast(tasks.filter(function(x){return x.type==="À trier"&&!isDone(x)}).length+" mail(s) à trier, "+tasks.filter(late).length+" tâche(s) en retard")};
render();
</script>
